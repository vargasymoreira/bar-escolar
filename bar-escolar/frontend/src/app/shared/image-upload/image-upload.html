<div class="image-upload-container">
    <!-- Preview Area -->
    <div class="upload-area" [class.dragging]="isDragging" [class.has-image]="previewUrl"
        (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
        <!-- Image Preview -->
        <div *ngIf="previewUrl" class="image-preview">
            <img [src]="previewUrl" alt="Preview" />
            <button *ngIf="!uploading && previewUrl !== currentImageUrl" (click)="removeImage()"
                class="remove-preview-btn" type="button" title="Remover selección">
                <lucide-icon [img]="X" [size]="16"></lucide-icon>
            </button>
            <button *ngIf="!uploading && currentImageUrl && previewUrl === currentImageUrl"
                (click)="clearCurrentImage()" class="remove-preview-btn" type="button" title="Eliminar imagen actual">
                <lucide-icon [img]="X" [size]="16"></lucide-icon>
            </button>
        </div>

        <!-- Upload Prompt -->
        <div *ngIf="!previewUrl" class="upload-prompt">
            <lucide-icon [img]="ImageIcon" [size]="48" class="upload-icon"></lucide-icon>
            <p class="upload-text">Arrastra una imagen aquí</p>
            <p class="upload-subtext">o haz clic para seleccionar</p>
            <p class="upload-hint">JPEG, PNG, GIF, WEBP (máx. 5MB)</p>
        </div>

        <!-- File Input -->
        <input type="file" #fileInput (change)="onFileSelected($event)"
            accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" class="file-input" />
    </div>

    <!-- Upload Progress -->
    <div *ngIf="uploading" class="upload-progress">
        <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="uploadProgress"></div>
        </div>
        <p class="progress-text">Subiendo... {{ uploadProgress }}%</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
        {{ error }}
    </div>

    <!-- Upload Button -->
    <button *ngIf="selectedFile && !uploading" (click)="uploadImage()" class="upload-btn" type="button">
        <lucide-icon [img]="Upload" [size]="18"></lucide-icon>
        <span>Subir Imagen</span>
    </button>
</div>
