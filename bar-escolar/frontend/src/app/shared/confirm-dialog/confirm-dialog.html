<div class="dialog-backdrop" (click)="onBackdropClick($event)">
    <div class="dialog-container">
        <!-- Icon -->
        <div class="dialog-icon" [class]="'icon-' + type">
            <lucide-icon [img]="type === 'danger' ? AlertTriangle : CheckCircle" [size]="48"></lucide-icon>
        </div>

        <!-- Content -->
        <div class="dialog-content">
            <h2 class="dialog-title">{{ title }}</h2>
            <p class="dialog-message">{{ message }}</p>
        </div>

        <!-- Actions -->
        <div class="dialog-actions">
            <button type="button" class="dialog-btn btn-cancel" (click)="onCancel()">
                {{ cancelText }}
            </button>
            <button type="button" class="dialog-btn btn-confirm" [class]="'btn-' + type" (click)="onConfirm()">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
